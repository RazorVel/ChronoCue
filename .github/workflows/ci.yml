name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/uninstall.sh
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run regression tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          CHRONOCUE_TEST_GUI: '1'
        run: xvfb-run -a -s "-screen 0 1440x1000x24 -nolisten tcp -extension GLX" python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .
