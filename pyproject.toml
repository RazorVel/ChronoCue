[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronocue"
version = "1.1.0"
description = "Simple configurable desktop schedule notification daemon for Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
chronocue-daemon = "chronocue.daemon:main"
chronocue-ui = "chronocue.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
